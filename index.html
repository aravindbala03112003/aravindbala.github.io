<!doctype html>
<html lang="en" class="dark" data-theme="dark" style="color-scheme: dark; background-color: #07101f;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#07101f" />
    <meta name="description" content="Aravind Bala — Software Developer creating clear, resilient products where thoughtful interaction meets practical engineering." />
    <meta name="keywords" content="Aravind Bala, Software Developer, Full Stack Developer, React, Java, Spring Boot, Portfolio, India" />
    <meta name="author" content="Aravind Bala" />
    
    <!-- Permanent Dark Mode Pre-styling: Zero white flash on initial paint -->
    <style>
      :root, html, body, #root {
        background-color: #07101f !important;
        color: #f4f6fb !important;
        color-scheme: dark !important;
      }
    </style>

    <!-- Permanent Dark Mode Sanitizer -->
    <script>
      (function() {
        try {
          localStorage.removeItem('theme');
          localStorage.removeItem('portfolio-theme');
          sessionStorage.removeItem('theme');
          sessionStorage.removeItem('portfolio-theme');
        } catch (e) {}
        document.documentElement.dataset.theme = 'dark';
        document.documentElement.classList.add('dark');
      })();
    </script>
    
    <!-- OpenGraph Meta Tags -->
    <meta property="og:title" content="Aravind Bala — Software Developer" />
